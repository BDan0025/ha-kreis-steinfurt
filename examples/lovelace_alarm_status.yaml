# Einzelkarte: Aktive und abgeschlossene Einsätze.
type: markdown
title: Alarmstatus im überwachten Gebiet
content: |-
  {% set gesamt = states('sensor.kreis_steinfurt_einsaetze') | int(0) %}
  {% set aktiv = states('sensor.kreis_steinfurt_laufende_einsatze') | int(0) %}
  {% set abgeschlossen = [gesamt - aktiv, 0] | max %}
  ## {{ aktiv }} aktive Alarme
  ## {{ abgeschlossen }} abgeschlossene Einsätze

  Insgesamt: **{{ gesamt }}** Einsätze im überwachten Gebiet.
