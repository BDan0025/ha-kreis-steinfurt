# Einzelkarte: Letzter Einsatz einer Stadt. Für eine andere Stadt Titel und Entity-ID anpassen.
type: markdown
title: Ibbenbüren – letzter Einsatz
content: |-
  {% set entity = 'sensor.kreis_steinfurt_letzter_einsatz_ibbenburen' %}
  {% if states(entity) not in ['unknown', 'unavailable'] %}
  **Vor / Laufzeit:** {{ states(entity) }}<br>
  **Einsatznummer:** {{ state_attr(entity, 'einsatznummer') | default('–') }}<br>
  **Einsatzart:** {{ state_attr(entity, 'einsatzart') | default('–') }}<br>
  **Beginn:** {{ state_attr(entity, 'beginn') | default('–') }}<br>
  **Zustand:** {{ state_attr(entity, 'status') | default('–') }}<br>
  {% if state_attr(entity, 'abgeschlossen_am') %}
  **Abgeschlossen am:** {{ as_local(as_datetime(state_attr(entity, 'abgeschlossen_am'))).strftime('%d.%m.%Y %H:%M') }}<br>
  **Einsatzdauer:** {{ state_attr(entity, 'dauer') | default('–') }}
  {% else %}
  Für Ibbenbüren ist noch kein Einsatz gespeichert.
  {% endif %}
