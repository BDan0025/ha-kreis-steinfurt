# Einzelkarte: Letzter Einsatz einer Stadt. Für eine andere Stadt Titel und Entity-ID anpassen.
# "Als abgeschlossen erkannt" ist der Abrufzeitpunkt der Integration, keine echte Endzeit.
type: markdown
title: Ibbenbüren – letzter Einsatz
content: |-
  {% set entity = 'sensor.kreis_steinfurt_letzter_einsatz_ibbenburen' %}
  {% if states(entity) not in ['unknown', 'unavailable'] %}
  **Zustand:** {{ states(entity) }}<br>
  **Einsatznummer:** {{ state_attr(entity, 'einsatznummer') | default('–') }}<br>
  **Einsatzart:** {{ state_attr(entity, 'einsatzart') | default('–') }}<br>
  **Beginn laut Quelle:** {{ state_attr(entity, 'beginn') | default('–') }}
  {% if state_attr(entity, 'als_abgeschlossen_erkannt_am') %}<br>
  **Als abgeschlossen erkannt:** {{ as_timestamp(state_attr(entity, 'als_abgeschlossen_erkannt_am')) | timestamp_custom('%d.%m.%Y %H:%M') }}<br>
  **Einsatzzeit bis Abschluss erkannt:** {{ state_attr(entity, 'einsatzzeit_bis_abschluss_erkannt') }}
  {% endif %}
  {% else %}
  Für Ibbenbüren ist noch kein Einsatz gespeichert.
  {% endif %}
