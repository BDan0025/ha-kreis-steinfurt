# Einzelkarte: Einsatzarten in der aktuellen Quelle, der letzten 24 Stunden
# und der vergangenen sieben Tage.
# Benötigt keine zusätzliche Custom Card.
type: markdown
title: Einsatzarten · Auswertung
content: >-
  {% set aktuell = state_attr('sensor.kreis_steinfurt_einsatzarten', 'einsatzarten') or {} %}
  {% set letzte_24_stunden = state_attr('sensor.kreis_steinfurt_einsatze_heute', 'nach_einsatzart') or {} %}
  {% set letzte_7_tage = state_attr('sensor.kreis_steinfurt_einsatze_letzte_7_tage', 'nach_einsatzart') or {} %}
  {% set arten = aktuell.keys() | list + letzte_24_stunden.keys() | list + letzte_7_tage.keys() | list %}

  {% if arten %}

  | Einsatzart | Aktuell | Letzte 24 Std. | Letzte 7 Tage |

  | :--- | ---: | ---: | ---: |

  {% for art in arten | unique | sort -%}

  | {{ art }} | {{ aktuell.get(art, {}).aktuell | default(0) }} | {{ letzte_24_stunden.get(art, 0) }} | {{ letzte_7_tage.get(art, 0) }} |

  {% endfor %}

  {% else %}

  Noch keine Einsatzarten gespeichert.

  {% endif %}
