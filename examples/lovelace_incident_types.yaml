# Einzelkarte: Einsatzarten in der aktuellen Quelle und der gespeicherten Historie.
# Benötigt keine zusätzliche Custom Card.
type: markdown
title: Einsatzarten · Auswertung
content: >-
  {% set arten = state_attr('sensor.kreis_steinfurt_einsatzarten', 'einsatzarten') or {} %}

  {% if arten %}

  | Einsatzart | Aktuell | Historie |

  | :--- | ---: | ---: |

  {% for art, werte in arten.items() | sort -%}

  | {{ art }} | {{ werte.aktuell | default(0) }} | {{ werte.historie | default(0) }} |

  {% endfor %}

  {% else %}

  Noch keine Einsatzarten gespeichert.

  {% endif %}
