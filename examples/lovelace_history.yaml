# Einzelkarte: Die 20 neuesten gespeicherten Einsätze.
type: markdown
title: Einsatzhistorie
content: |-
  {% set historie = state_attr('sensor.kreis_steinfurt_einsatzhistorie', 'einsaetze') or [] %}
  {% if historie | count > 0 %}
  | Beginn | Ort | Einsatzart | Zustand | Einsatzzeit* |
  | :--- | :--- | :--- | :--- | :--- |
  {% for e in historie[:20] -%}
  | {{ e.beginn }} | {{ e.ort }} | **{{ e.einsatzart }}** | {{ e.status }} | {{ e.einsatzzeit_bis_abschluss_erkannt or '–' }} |
  {% endfor %}
  <small>* Bis die Integration den Status „abgeschlossen“ erstmals erkannt hat; keine echte Endzeit der Quelle.</small>
  {% else %}
  Für das ausgewählte Gebiet ist noch keine Einsatzhistorie gespeichert.
  {% endif %}
