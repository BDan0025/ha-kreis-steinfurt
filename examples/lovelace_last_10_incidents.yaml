# Einzelkarte: Die zehn neuesten gespeicherten Einsätze im ausgewählten Gebiet.
# Enthält laufende und abgeschlossene Einsätze.
type: markdown
title: Letzte 10 Einsätze
content: |-
  {% set historie = state_attr('sensor.kreis_steinfurt_einsatzhistorie', 'einsaetze') or [] %}
  {% if historie | count > 0 %}
  | Beginn | Ort | Einsatzart | Zustand | Dauer |
  | :--- | :--- | :--- | :--- | :--- |
  {% for e in historie[:10] -%}
  | {{ e.beginn }} | {{ e.ort }} | **{{ e.einsatzart }}** | {{ e.status }} | {{ e.dauer | default('–') }} |
  {% endfor %}
  {% else %}
  Für das ausgewählte Gebiet ist noch kein Einsatz gespeichert.
  {% endif %}
