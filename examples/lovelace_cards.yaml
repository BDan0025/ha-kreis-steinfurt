# Kombiniertes Beispiel für ein Home-Assistant-Dashboard.
# Die einzelnen Karten liegen zusätzlich als eigene Dateien in diesem Ordner.

# Übersicht aller Einsätze
type: vertical-stack
cards:
  - type: entities
    title: Kreis Steinfurt Einsätze
    entities:
      - entity: sensor.kreis_steinfurt_einsatze
        name: Einsätze (48 h)
      - entity: sensor.kreis_steinfurt_einsatze_ibbenburen
        name: Ibbenbüren
      - entity: sensor.kreis_steinfurt_abrufintervall
        name: Abrufintervall

  # Stadtname und Entity-ID bei Bedarf anpassen.
  - type: markdown
    title: Ibbenbüren – aktuelle Einsätze
    content: |
      {% set einsaetze = state_attr('sensor.kreis_steinfurt_einsatze_ibbenburen', 'einsaetze') or [] %}
      {% if einsaetze | count > 0 %}
      | Zeit | Sachverhalt | Zustand |
      | :--- | :--- | :--- |
      {% for e in einsaetze -%}
      | {{ e.zeit[11:16] if e.zeit is defined else e.beginn[11:16] }} | **{{ e.sachverhalt if e.sachverhalt is defined else e.einsatzart }}** | *{{ e.zustand if e.zustand is defined else e.status }}* |
      {% endfor %}
      {% else %}
      Aktuell keine gemeldeten Einsätze in Ibbenbüren.
      {% endif %}
